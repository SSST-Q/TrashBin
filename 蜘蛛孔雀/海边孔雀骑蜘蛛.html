<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海边孔雀骑蜘蛛</title>
<style>
:root{
  --ink:#2a1b12;
  --cream:#fff6e6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,2.2vw,26px);
  padding:clamp(14px,2.4vw,34px);
  background:
    radial-gradient(1200px 700px at 18% 8%, #16324a 0%, #0a1725 55%, #060d16 100%),
    #060d16;
  color:var(--cream);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.stage{
  position:relative;
  flex:0 0 auto;
  width:min(96vw, 1500px, calc((100vh - 140px) * 16 / 9));
  aspect-ratio:16/9;
  border-radius:clamp(10px,1.4vw,22px);
  overflow:hidden;
  background:#08131d;
  box-shadow:
    0 2px 0 rgba(255,240,214,.18) inset,
    0 30px 70px -30px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,225,180,.16),
    0 0 90px -30px rgba(255,196,120,.35);
}
.stage::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:0 0 120px 20px rgba(0,0,0,.35) inset;
}
svg.scene{display:block;width:100%;height:100%;aspect-ratio:16/9}
.caption{
  width:min(96vw, 1500px, calc((100vh - 140px) * 16 / 9));
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  justify-content:space-between;
  gap:8px 18px;
  padding:0 clamp(2px,.4vw,8px);
}
.caption h1{
  margin:0;
  font-size:clamp(15px,1.35vw,21px);
  font-weight:600;
  letter-spacing:.16em;
  color:#ffe8bf;
  text-shadow:0 1px 14px rgba(255,190,120,.35);
}
.caption p{
  margin:0;
  font-size:clamp(11px,.92vw,14px);
  letter-spacing:.1em;
  color:#a9c3c6;
}
.caption .dot{
  display:inline-block;
  width:6px;height:6px;border-radius:50%;
  margin-right:7px;vertical-align:1px;
  background:#7fe3c9;
  box-shadow:0 0 10px 2px rgba(110,230,200,.6);
}

/* ---------------- motion ---------------- */
@keyframes waveSlide{
  from{transform:translateX(0)}
  to{transform:translateX(-400px)}
}
@keyframes cloudDrift{
  from{transform:translateX(-40px)}
  to{transform:translateX(60px)}
}
@keyframes twinkle{
  0%,100%{opacity:.14}
  45%{opacity:.9}
}
@keyframes gull{
  0%,100%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-7px) scaleY(.82)}
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes fanSway{
  0%,100%{transform:rotate(-1.1deg)}
  50%{transform:rotate(1.1deg)}
}
@keyframes moteFloat{
  0%{transform:translate(0,0);opacity:0}
  20%{opacity:.75}
  100%{transform:translate(var(--dx,18px),-120px);opacity:0}
}
@keyframes sparkle{
  0%,100%{transform:scale(.2);opacity:0}
  45%{transform:scale(1);opacity:.95}
}
@keyframes featherBreathe{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(.5deg)}
}
.wave{animation-name:waveSlide;animation-timing-function:linear;animation-iteration-count:infinite}
.cloud{animation-name:cloudDrift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.twinkle{animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.gull{animation-name:gull;animation-timing-function:ease-in-out;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
.mote{animation-name:moteFloat;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.sparkle{animation-name:sparkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
#peacock,#spider,#saddle{transform-box:fill-box;transform-origin:50% 100%}
#peacock{animation:bob 6.5s ease-in-out infinite}
#tail,#peaCrest{transform-box:fill-box;transform-origin:70% 100%}
#tail{animation:fanSway 9s ease-in-out infinite}
.fan-back,.fan-mid{transform-box:fill-box;transform-origin:50% 100%}
.fan-back{animation:featherBreathe 11s ease-in-out infinite}
.fan-mid{animation:featherBreathe 8s ease-in-out infinite reverse}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
</head>
